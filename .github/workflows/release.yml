name: Release theme

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          slug="velocity-mp-child"
          version="$(sed -n 's/^[[:space:]]*Version:[[:space:]]*//p' style.css | head -n 1 | tr -d '\r')"

          if [[ -z "$version" ]]; then
            echo "Version is missing from style.css." >&2
            exit 1
          fi

          mkdir -p "release/$slug"
          rsync -a --exclude='.git' --exclude='.github' --exclude='release' ./ "release/$slug/"
          cd release
          zip -qr "../${slug}-${version}.zip" "$slug"

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Update release tag
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="velocity-mp-child-${RELEASE_VERSION}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi
